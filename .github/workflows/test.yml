name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, which may not offer Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.9 is the oldest version the README promises; the validator uses only the stdlib.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (validator rules, templates, skill integrity)
        run: python -m unittest discover -s tests -v
