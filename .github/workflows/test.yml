name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, which may not offer Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.9 is the oldest version the README promises; the validator uses only the stdlib.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (validator rules, templates, skill integrity)
        run: python -m unittest discover -s tests -v
