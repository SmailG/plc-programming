name: Feature request
description: Suggest a new validator rule, platform, format or skill topic.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the plugin makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work. For a validator rule, include an input it must catch and one it must accept.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Manuals, standards or vendor documents that back the behaviour (title, document number, version).
